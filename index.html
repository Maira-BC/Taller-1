<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de atención y gestión de turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="encabezado">
        <header>
            <h1>Sistema de atención y gestión de turnos</h1>
        </header>
        <nav>
            <button type="button" id="obtener-turno">Obtener turno</button>
            <button type="button" id="estado-turnos">Estado de turnos</button>
        </nav>
    </div>
    <section id="contenido-obtener-turno">
        <div class="contenido1">
            <h2>OBTENER TURNO</h2>
            <hr>
            <p>Tipo de atención:</p>
            <select id="tipo-atencion" class="form-select">
                <option value="">Seleccionar tipo de atención</option>
                <option value="Matricula">Matrícula</option>
                <option value="Finanzas">Finanzas</option>
                <option value="Becas">Becas</option>
                <option value="Asesoria">Asesoría</option>
            </select>
            <button type="button" id="generar-numero" class="btn">GENERAR NÚMERO</button>
            <p class="titulo-turno">Tu turno:</p>
            <p id="numero-turno">- -</p>
            <p><strong>Estado:</strong> <span id="estado-turno">- -</span></p>
        </div>
    </section>
    <section id="contenido-estado-turnos" class="d-none">
        <div class="contenido2">
            <h2>ESTADO DE ATENCIÓN</h2>
            <hr>
            <p class="titulo-turno">Turno actual</p>
            <p id="turno-actual">- -</p>
            <p>Módulo de atención: <span id="modulo-atencion">- -</span></p>
            <p>Atención: <span id="atencion">- -</span></p>
            <h3>Siguientes turnos</h3>
            <ul id="lista-espera"></ul>
            <div class="container text-center">
                <div class="row align-items-start">
                    <div class="col">
                        <p>En espera: <span id="turnos-en-espera">0</span></p>
                    </div>
                    <div class="col">
                        <p>Atendidos: <span id="turnos-atendidos">0</span></p>
                    </div>
                </div>
            </div>
            <div id="mensaje-sistema" class="alert alert-info d-none" role="alert"></div>
            <button type="button" id="llamar-siguiente" class="btn">LLAMAR SIGUIENTE</button>
        </div>
    </section>
    <script src="js/app.js"></script>
</body>
</html>
